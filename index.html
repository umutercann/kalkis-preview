    -->
    <script>
      (function (urls) {
        var locale = null;
        try {
          locale = localStorage.getItem('kalkis.locale');
        } catch (e) {}
        if (!urls[locale]) {
          locale = 'tr';
          var languages = navigator.languages || [];
          for (var i = 0; i < languages.length; i++) {
            var base = String(languages[i]).toLowerCase().split('-')[0];
            if (urls[base]) {
              locale = base;
              break;
            }
          }
        }
        if (!urls[locale]) return;
        var link = document.createElement('link');
        link.rel = 'modulepreload';
        link.crossOrigin = '';
        link.href = urls[locale];
        document.head.appendChild(link);
      })({"en":"/kalkis-preview/assets/en-B9amphLh.js","tr":"/kalkis-preview/assets/tr-BXHxGYMF.js"});
